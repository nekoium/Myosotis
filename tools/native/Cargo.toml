[package]
name = "myosotis-tools"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Controls", "Win32_System_DataExchange", "Win32_System_Performance", "Win32_System_ProcessStatus"] }

[[bin]]
name = "stroke-probe"
path = "src/probe.rs"

[[bin]]
name = "release-showcase"
path = "src/showcase.rs"
