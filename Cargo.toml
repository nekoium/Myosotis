[package]
name = "myosotis"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Capture, scribble, and paste. A small native Windows annotation app."

[dependencies]
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation_Numerics",
  "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Memory",
  "Win32_System_Ole", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi", "Win32_UI_Shell",
  "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common"
] }

[build-dependencies]
embed-resource = "3.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
